<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Resonance Feed — Wuthering Waves Leak Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0F1319;
    --panel:#171D27;
    --panel-alt:#1C2430;
    --border:#2A3340;
    --text:#E7EAEE;
    --text-dim:#8B95A5;
    --confirmed:#4FD8B8;
    --confirmed-dim:rgba(79,216,184,0.14);
    --likely:#E8AE4D;
    --likely-dim:rgba(232,174,77,0.14);
    --speculative:#9B8FC0;
    --speculative-dim:rgba(155,143,192,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px;margin:0 auto;padding:0 0 90px;}

  /* header */
  .header{
    padding:22px 18px 14px;
    position:relative;
    overflow:hidden;
    border-bottom:1px solid var(--border);
  }
  .header svg.wave{position:absolute;left:0;right:0;bottom:0;width:100%;height:34px;opacity:0.35;}
  .eyebrow-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--confirmed);box-shadow:0 0 8px var(--confirmed);}
  .header h1{
    font-family:'Space Grotesk',sans-serif;
    font-weight:700;
    font-size:26px;
    margin:0 0 4px;
    letter-spacing:-0.01em;
  }
  .header p{margin:0;color:var(--text-dim);font-size:13.5px;line-height:1.5;max-width:52ch;}

  /* tabs */
  .tabs{
    display:flex;gap:6px;overflow-x:auto;padding:14px 18px 0;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;
    padding:8px 14px;
    border-radius:8px;
    background:transparent;
    border:1px solid var(--border);
    color:var(--text-dim);
    font-family:'Space Grotesk',sans-serif;
    font-size:13.5px;
    font-weight:500;
    cursor:pointer;
    white-space:nowrap;
  }
  .tab.active{
    background:var(--panel-alt);
    border-color:var(--confirmed);
    color:var(--text);
  }

  /* filters */
  .filters{display:flex;gap:8px;padding:12px 18px 0;flex-wrap:wrap;}
  .chip{
    padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;
    border:1px solid var(--border);color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    display:flex;align-items:center;gap:6px;
  }
  .chip .bars{display:flex;gap:2px;}
  .chip .bar{width:3px;height:9px;border-radius:1px;background:var(--border);}
  .chip[data-tier="confirmed"].active{border-color:var(--confirmed);color:var(--confirmed);background:var(--confirmed-dim);}
  .chip[data-tier="likely"].active{border-color:var(--likely);color:var(--likely);background:var(--likely-dim);}
  .chip[data-tier="speculative"].active{border-color:var(--speculative);color:var(--speculative);background:var(--speculative-dim);}
  .chip[data-tier="all"].active{border-color:var(--text);color:var(--text);background:var(--panel-alt);}

  /* list */
  .list{padding:16px 18px 0;display:flex;flex-direction:column;gap:10px;}
  .empty{
    color:var(--text-dim);
    text-align:center;
    padding:40px 20px;
    font-size:13.5px;
    line-height:1.6;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:14px 14px 12px;
  }
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card-name{
    font-family:'Space Grotesk',sans-serif;
    font-weight:600;
    font-size:15.5px;
  }
  .card-cat{color:var(--text-dim);font-size:11.5px;font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .signal{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:0 0 auto;}
  .signal .bars{display:flex;gap:2px;}
  .signal .bar{width:4px;border-radius:1px;background:var(--border);}
  .signal .bar:nth-child(1){height:6px;}
  .signal .bar:nth-child(2){height:10px;}
  .signal .bar:nth-child(3){height:14px;}
  .signal-label{font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:0.02em;}

  .tier-confirmed .bar{background:var(--confirmed);}
  .tier-confirmed .signal-label{color:var(--confirmed);}
  .tier-likely .bar:nth-child(1),.tier-likely .bar:nth-child(2){background:var(--likely);}
  .tier-likely .signal-label{color:var(--likely);}
  .tier-speculative .bar:nth-child(1){background:var(--speculative);}
  .tier-speculative .signal-label{color:var(--speculative);}

  .card-desc{font-size:13.5px;line-height:1.55;color:var(--text);margin:10px 0 10px;}
  .card-meta{
    display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--border);
    padding-top:9px;
    font-size:11.5px;
    color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace;
    gap:8px;
  }
  .card-meta .src{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .card-del{
    background:none;border:none;color:var(--text-dim);cursor:pointer;font-size:12px;
    font-family:'Inter',sans-serif;padding:2px 4px;
  }
  .card-del:hover{color:#E36767;}

  /* fab */
  .fab{
    position:fixed;right:20px;bottom:22px;
    width:54px;height:54px;border-radius:50%;
    background:var(--confirmed);color:#0F1319;
    border:none;font-size:26px;font-weight:600;
    box-shadow:0 6px 20px rgba(79,216,184,0.35);
    cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    z-index:20;
  }

  /* modal */
  .overlay{
    position:fixed;inset:0;background:rgba(6,8,12,0.72);
    display:none;align-items:flex-end;justify-content:center;z-index:30;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:16px 16px 0 0;
    width:100%;max-width:720px;
    max-height:88vh;overflow-y:auto;
    padding:18px 18px 24px;
  }
  .sheet h2{
    font-family:'Space Grotesk',sans-serif;font-size:18px;margin:0 0 14px;
  }
  .field{margin-bottom:12px;}
  .field label{display:block;font-size:12px;color:var(--text-dim);margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
  .field input,.field textarea,.field select{
    width:100%;background:var(--panel-alt);border:1px solid var(--border);
    border-radius:8px;color:var(--text);padding:10px 11px;font-size:14px;
    font-family:'Inter',sans-serif;
  }
  .field textarea{resize:vertical;min-height:64px;}
  .tier-select{display:flex;gap:8px;}
  .tier-opt{
    flex:1;padding:9px 6px;text-align:center;border-radius:8px;border:1px solid var(--border);
    color:var(--text-dim);font-size:12px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
  }
  .tier-opt.sel[data-tier="confirmed"]{border-color:var(--confirmed);color:var(--confirmed);background:var(--confirmed-dim);}
  .tier-opt.sel[data-tier="likely"]{border-color:var(--likely);color:var(--likely);background:var(--likely-dim);}
  .tier-opt.sel[data-tier="speculative"]{border-color:var(--speculative);color:var(--speculative);background:var(--speculative-dim);}
  .sheet-actions{display:flex;gap:10px;margin-top:16px;}
  .btn{
    flex:1;padding:11px;border-radius:8px;border:1px solid var(--border);
    background:transparent;color:var(--text-dim);font-size:14px;cursor:pointer;
    font-family:'Space Grotesk',sans-serif;font-weight:500;
  }
  .btn.primary{background:var(--confirmed);color:#0F1319;border-color:var(--confirmed);font-weight:600;}
</style>
</head>
<body>

<div class="app">
  <div class="header">
    <div class="eyebrow-row"><span class="dot"></span><span style="font-family:'IBM Plex Mono',monospace;font-size:11.5px;color:var(--text-dim);">LIVE TRACKER · PERSONAL</span></div>
    <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px;">
      <div>
        <h1>Resonance Feed</h1>
        <p>Your own Wuthering Waves leak board. Log what you find anywhere — Reddit, Discord, X, forums — and rate how solid it actually is. Sorted strongest signal first.</p>
      </div>
    </div>
    <button id="refreshBtn" style="margin-top:12px;padding:9px 14px;border-radius:8px;background:var(--panel-alt);border:1px solid var(--confirmed);color:var(--confirmed);font-family:'Space Grotesk',sans-serif;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:8px;">
      <span id="refreshIcon">⟳</span><span id="refreshLabel">Scan for new leaks</span>
    </button>
    <div id="refreshStatus" style="font-size:11.5px;color:var(--text-dim);margin-top:6px;font-family:'IBM Plex Mono',monospace;"></div>
    <svg class="wave" viewBox="0 0 720 34" preserveAspectRatio="none"><path d="M0,17 L40,17 L48,4 L56,30 L64,10 L72,24 L80,17 L120,17 L128,8 L136,26 L144,17 L200,17 L208,2 L216,32 L224,17 L280,17 L288,12 L296,22 L304,17 L360,17 L368,6 L376,28 L384,17 L440,17 L448,9 L456,25 L464,17 L520,17 L528,3 L536,31 L544,17 L600,17 L608,13 L616,21 L624,17 L680,17 L688,7 L696,27 L704,17 L720,17" fill="none" stroke="#4FD8B8" stroke-width="1.5"/></svg>
  </div>

  <div class="tabs" id="tabs"></div>
  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
</div>

<button class="fab" id="fabAdd" title="Log a leak">+</button>

<div class="overlay" id="overlay">
  <div class="sheet">
    <h2 id="sheetTitle">Log a leak</h2>
    <div class="field">
      <label>Name / title</label>
      <input id="fName" placeholder="e.g. Character name, weapon, echo, boss">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="fCat">
        <option value="characters">Character</option>
        <option value="weapons">Weapon</option>
        <option value="echoes">Echo</option>
        <option value="bosses">Boss</option>
        <option value="maps">Map / Region</option>
      </select>
    </div>
    <div class="field">
      <label>Details</label>
      <textarea id="fDesc" placeholder="What's claimed — kit, element, weapon type, release version, etc."></textarea>
    </div>
    <div class="field">
      <label>Source</label>
      <input id="fSrc" placeholder="e.g. Stepleaker, r/wutheringwavesleaks, in-game datamine">
    </div>
    <div class="field">
      <label>Version / date tag</label>
      <input id="fVer" placeholder="e.g. 2.7 banner, closed beta 3.2">
    </div>
    <div class="field">
      <label>How likely is this true?</label>
      <div class="tier-select" id="tierSelect">
        <div class="tier-opt" data-tier="confirmed">Confirmed<br>official</div>
        <div class="tier-opt sel" data-tier="likely">Likely<br>reliable leaker</div>
        <div class="tier-opt" data-tier="speculative">Speculative<br>rumor/guess</div>
      </div>
    </div>
    <div class="sheet-actions">
      <button class="btn" id="cancelBtn">Cancel</button>
      <button class="btn primary" id="saveBtn">Save leak</button>
    </div>
  </div>
</div>

<script>
const CATS = [
  {id:'all', label:'All'},
  {id:'characters', label:'Characters'},
  {id:'weapons', label:'Weapons'},
  {id:'echoes', label:'Echoes'},
  {id:'bosses', label:'Bosses'},
  {id:'maps', label:'Maps'},
];
const TIER_ORDER = {confirmed:0, likely:1, speculative:2};
const TIER_LABEL = {confirmed:'CONFIRMED', likely:'LIKELY', speculative:'SPECULATIVE'};

let state = {
  activeCat: 'all',
  activeTier: 'all',
  entries: [],
  editingTier: 'likely',
};

const SEED = [
  {name:"Version roadmap character wave", cat:"characters", desc:"Kuro typically drip-markets two new 5-star Resonators per major version through official teaser trailers before banners go live — treat anything past that stage as far less certain.", src:"Pattern from official Kuro trailers", ver:"Recurring pattern", tier:"confirmed"},
  {name:"New Resonators ahead of official drip marketing", cat:"characters", desc:"Names, elements and weapon types for upcoming Resonators often surface from known dataminers (e.g. Stepleaker-type accounts) weeks before official drip marketing confirms them.", src:"Community leakers (unverified until Kuro posts)", ver:"Ongoing", tier:"likely"},
  {name:"Full kit numbers before closed beta ends", cat:"weapons", desc:"Exact multiplier percentages and skill sequences seen early in closed beta footage frequently change before live release — early kit leaks are a rough sketch, not final numbers.", src:"Closed beta footage / forums", ver:"Pre-release", tier:"speculative"},
  {name:"New region teased in story trailers", cat:"maps", desc:"Large map expansions are usually confirmed months ahead via cinematic trailers, so a region's existence is solid well before its exact layout is.", src:"Official cinematic trailers", ver:"Long-lead", tier:"confirmed"},
  {name:"New weekly/echo boss silhouette in files", cat:"bosses", desc:"New boss models pulled from game files hint strongly at an upcoming Tacet Discord or weekly boss, though its exact drop version can shift.", src:"Datamine", ver:"Pre-patch", tier:"likely"},
  {name:"Unreleased echo skill effects", cat:"echoes", desc:"Datamined echo cost/skill data sometimes belongs to test entries that never ship — treat unnamed or oddly-costed echoes with real caution.", src:"Datamine", ver:"Unconfirmed", tier:"speculative"},
];

async function loadEntries(){
  try{
    const res = await window.storage.get('wuwa-leaks-entries', false);
    state.entries = res ? JSON.parse(res.value) : SEED.map(seedToEntry);
    if(!res){ await saveEntries(); }
  }catch(e){
    state.entries = SEED.map(seedToEntry);
  }
  render();
  await loadAiFeed();
}

// Pulls the auto-updated feed committed by the GitHub Actions scan (docs/leaks.json).
// Safe to fail silently if this file is served outside that repo setup (e.g. inside claude.ai).
async function loadAiFeed(){
  try{
    const res = await fetch('./leaks.json', {cache:'no-store'});
    if(!res.ok) return;
    const feed = await res.json();
    if(!Array.isArray(feed) || feed.length===0) return;
    let added = 0;
    feed.forEach(item=>{
      const dup = state.entries.some(e=>e.name.toLowerCase()===String(item.name).toLowerCase());
      if(dup) return;
      state.entries.unshift(item);
      added++;
    });
    if(added>0){ await saveEntries(); render(); }
  }catch(e){ /* not hosted with a leaks.json — that's fine */ }
}
function seedToEntry(s){
  return {id:'seed-'+Math.random().toString(36).slice(2), name:s.name, cat:s.cat, desc:s.desc, src:s.src, ver:s.ver, tier:s.tier, ts:Date.now()};
}
async function saveEntries(){
  try{ await window.storage.set('wuwa-leaks-entries', JSON.stringify(state.entries), false); }
  catch(e){ console.error('Storage error', e); }
}

function renderTabs(){
  const tabsEl = document.getElementById('tabs');
  tabsEl.innerHTML = '';
  CATS.forEach(c=>{
    const b = document.createElement('button');
    b.className = 'tab' + (state.activeCat===c.id ? ' active':'');
    b.textContent = c.label;
    b.onclick = ()=>{ state.activeCat=c.id; render(); };
    tabsEl.appendChild(b);
  });
}
function renderFilters(){
  const f = document.getElementById('filters');
  f.innerHTML='';
  const tiers = [
    {id:'all', label:'All signals'},
    {id:'confirmed', label:'Confirmed'},
    {id:'likely', label:'Likely'},
    {id:'speculative', label:'Speculative'},
  ];
  tiers.forEach(t=>{
    const c = document.createElement('div');
    c.className = 'chip' + (state.activeTier===t.id ? ' active':'');
    c.dataset.tier = t.id;
    c.textContent = t.label;
    c.onclick = ()=>{ state.activeTier=t.id; render(); };
    f.appendChild(c);
  });
}
function renderList(){
  const list = document.getElementById('list');
  list.innerHTML='';
  let items = state.entries.filter(e=>
    (state.activeCat==='all' || e.cat===state.activeCat) &&
    (state.activeTier==='all' || e.tier===state.activeTier)
  );
  items.sort((a,b)=> TIER_ORDER[a.tier]-TIER_ORDER[b.tier] || b.ts-a.ts);

  if(items.length===0){
    list.innerHTML = '<div class="empty">No leaks logged here yet.<br>Tap + to add the first one for this view.</div>';
    return;
  }

  items.forEach(e=>{
    const card = document.createElement('div');
    card.className = 'card';
    const catLabel = CATS.find(c=>c.id===e.cat)?.label.replace(/s$/,'') || e.cat;
    card.innerHTML = `
      <div class="card-top">
        <div>
          <div class="card-name">${escapeHtml(e.name)}</div>
          <div class="card-cat">${catLabel.toUpperCase()}</div>
        </div>
        <div class="signal tier-${e.tier}">
          <div class="bars"><div class="bar"></div><div class="bar"></div><div class="bar"></div></div>
          <div class="signal-label">${TIER_LABEL[e.tier]}</div>
        </div>
      </div>
      <div class="card-desc">${escapeHtml(e.desc)}</div>
      <div class="card-meta">
        <span class="src">${escapeHtml(e.src || 'Unknown source')}${e.ver ? ' · '+escapeHtml(e.ver) : ''}</span>
        <button class="card-del" data-id="${e.id}">Remove</button>
      </div>
    `;
    list.appendChild(card);
  });

  list.querySelectorAll('.card-del').forEach(btn=>{
    btn.onclick = async ()=>{
      state.entries = state.entries.filter(e=>e.id!==btn.dataset.id);
      await saveEntries();
      render();
    };
  });
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function render(){
  renderTabs();
  renderFilters();
  renderList();
}

// Modal
const overlay = document.getElementById('overlay');
document.getElementById('fabAdd').onclick = ()=>{
  document.getElementById('fName').value='';
  document.getElementById('fDesc').value='';
  document.getElementById('fSrc').value='';
  document.getElementById('fVer').value='';
  document.getElementById('fCat').value = state.activeCat==='all' ? 'characters' : state.activeCat;
  setTier('likely');
  overlay.classList.add('open');
};
document.getElementById('cancelBtn').onclick = ()=> overlay.classList.remove('open');
overlay.onclick = (e)=>{ if(e.target===overlay) overlay.classList.remove('open'); };

document.querySelectorAll('.tier-opt').forEach(opt=>{
  opt.onclick = ()=> setTier(opt.dataset.tier);
});
function setTier(t){
  state.editingTier = t;
  document.querySelectorAll('.tier-opt').forEach(o=>{
    o.classList.toggle('sel', o.dataset.tier===t);
  });
}

document.getElementById('saveBtn').onclick = async ()=>{
  const name = document.getElementById('fName').value.trim();
  const desc = document.getElementById('fDesc').value.trim();
  if(!name || !desc){ return; }
  const entry = {
    id: 'e-'+Date.now()+'-'+Math.random().toString(36).slice(2),
    name, desc,
    cat: document.getElementById('fCat').value,
    src: document.getElementById('fSrc').value.trim(),
    ver: document.getElementById('fVer').value.trim(),
    tier: state.editingTier,
    ts: Date.now(),
  };
  state.entries.unshift(entry);
  await saveEntries();
  overlay.classList.remove('open');
  render();
};

loadEntries();

// --- On-demand AI scan (calls Claude w/ web search when you tap the button) ---
const refreshBtn = document.getElementById('refreshBtn');
const refreshStatus = document.getElementById('refreshStatus');
const refreshIcon = document.getElementById('refreshIcon');
const refreshLabel = document.getElementById('refreshLabel');

refreshBtn.onclick = async ()=>{
  refreshBtn.disabled = true;
  refreshIcon.style.animation = 'spin 1s linear infinite';
  refreshLabel.textContent = 'Scanning...';
  refreshStatus.textContent = 'Searching for current Wuthering Waves leak discussion...';

  const existingNames = state.entries.map(e=>e.name).join('; ');
  const prompt = `Search the web for the most recent Wuthering Waves (the video game by Kuro Games) leaks, rumors, and datamine findings discussed right now across places like Reddit (r/wutheringwavesleaks), leaker Twitter/X accounts, and fan wikis.

Find NEW items not already in this existing list: ${existingNames || '(none yet)'}

Return ONLY a raw JSON array (no markdown fences, no commentary) of up to 8 items, each shaped exactly like:
{"name": "short title", "cat": "characters|weapons|echoes|bosses|maps", "desc": "1-2 sentence plain-language summary of the claim", "src": "where this is circulating, e.g. a specific leaker name or subreddit", "ver": "version or date this is tied to, or empty string", "tier": "confirmed|likely|speculative"}

Tier guide: "confirmed" = stated in official Kuro channels; "likely" = from an established leaker/datamine with a decent track record; "speculative" = early rumor, fan theory, or unverified claim. If you find nothing genuinely new, return [].`;

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1500,
        messages: [{role:"user", content: prompt}],
        tools: [{type:"web_search_20250305", name:"web_search"}]
      })
    });
    const data = await response.json();
    const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
    const cleaned = textBlocks.replace(/```json|```/g,'').trim();
    const match = cleaned.match(/\[[\s\S]*\]/);
    const found = match ? JSON.parse(match[0]) : [];

    const validCats = ['characters','weapons','echoes','bosses','maps'];
    const validTiers = ['confirmed','likely','speculative'];
    let added = 0;
    found.forEach(item=>{
      if(!item.name || !item.desc) return;
      if(!validCats.includes(item.cat)) item.cat = 'characters';
      if(!validTiers.includes(item.tier)) item.tier = 'speculative';
      const dup = state.entries.some(e=>e.name.toLowerCase()===String(item.name).toLowerCase());
      if(dup) return;
      state.entries.unshift({
        id:'ai-'+Date.now()+'-'+Math.random().toString(36).slice(2),
        name:item.name, cat:item.cat, desc:item.desc,
        src:item.src||'AI web scan', ver:item.ver||'', tier:item.tier, ts:Date.now()
      });
      added++;
    });
    await saveEntries();
    render();
    refreshStatus.textContent = added>0
      ? `Added ${added} new item${added===1?'':'s'} — double-check anything tagged speculative.`
      : 'No genuinely new leaks found this scan. Try again later.';
  }catch(e){
    console.error(e);
    refreshStatus.textContent = 'Scan failed — check your connection and try again.';
  }finally{
    refreshBtn.disabled = false;
    refreshIcon.style.animation = '';
    refreshLabel.textContent = 'Scan for new leaks';
  }
};
</script>
<style>
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}
</style>
</body>
</html>
