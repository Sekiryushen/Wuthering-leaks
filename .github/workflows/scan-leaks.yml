name: Scan Wuthering Waves leaks

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run leak scan
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node scripts/scan-leaks.mjs

      - name: Commit updated leaks.json
        run: |
          git config user.name "leak-bot"
          git config user.email "leak-bot@users.noreply.github.com"
          git add docs/leaks.json
          git diff --quiet --cached || git commit -m "Auto-update leaks feed"
          git push
